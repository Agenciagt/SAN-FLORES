<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet Digital UMG - Sede Boca del Monte</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f5f9;
        }

        /* Standard ID Card Dimensions (CR-80 aspect ratio roughly) */
        .id-card {
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        @media print {
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .id-card {
                box-shadow: none;
                border: 1px solid #cbd5e1;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800">

    <!-- Action Toolbar (No-print) -->
    <div class="no-print w-full max-w-sm mb-6 flex items-center justify-between gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-200">
        <label class="flex items-center gap-2 cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition-colors">
            <i class="fa-solid fa-camera"></i>
            <span>Subir Foto</span>
            <input type="file" id="photoInput" accept="image/*" class="hidden">
        </label>
        
        <button onclick="window.print()" class="flex items-center gap-2 bg-[#002855] hover:bg-[#001d3d] text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow-sm">
            <i class="fa-solid fa-print"></i>
            <span>Imprimir Carnet</span>
        </button>
    </div>

    <!-- Official Student ID Card -->
    <div class="id-card bg-white rounded-2xl overflow-hidden border border-slate-200 flex flex-col justify-between relative">
        
        <!-- Header Banner -->
        <div class="bg-[#002855] text-white px-5 py-4 relative border-b-4 border-[#c5a059]">
            <div class="flex items-center gap-3">
                <!-- University Emblem / Logo Placeholder -->
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-[#002855] shrink-0 shadow-sm">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider uppercase leading-tight text-white">
                        Universidad Mariano Gálvez
                    </h1>
                    <p class="text-[10px] font-medium text-amber-200 uppercase tracking-widest mt-0.5">
                        Guatemala
                    </p>
                </div>
            </div>
        </div>

        <!-- Student ID Card Body -->
        <div class="p-6 flex flex-col items-center text-center flex-1 justify-center">
            
            <!-- Photo Slot -->
            <div class="relative mb-5">
                <div class="w-32 h-38 w-32 h-32 rounded-full overflow-hidden border-4 border-slate-100 shadow-md bg-slate-50 flex items-center justify-center relative">
                    <img id="profileImage" src="https://placehold.co/150x150/e2e8f0/64748b?text=Foto" alt="Fotografía del Estudiante" class="w-full h-full object-cover hidden">
                    <div id="photoPlaceholder" class="flex flex-col items-center justify-center text-slate-400">
                        <i class="fa-solid fa-user text-5xl"></i>
                    </div>
                </div>
                <div class="absolute -bottom-1 -right-1 bg-[#002855] text-amber-400 w-7 h-7 rounded-full flex items-center justify-center text-xs border-2 border-white shadow">
                    <i class="fa-solid fa-id-badge"></i>
                </div>
            </div>

            <!-- Student Name -->
            <div class="mb-4">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Nombre del Estudiante</span>
                <h2 class="text-lg font-black text-slate-900 leading-tight">
                    Zoris Yuzelmi Pivaral Monroy
                </h2>
            </div>

            <!-- Carnet Number Box -->
            <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mb-2">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Número de Carnet</span>
                <p class="text-xl font-mono font-black text-[#002855] tracking-widest mt-0.5">
                    9885 24 18395
                </p>
            </div>

        </div>

        <!-- Footer / Mandatory Project Text -->
        <div class="bg-slate-900 text-white p-3.5 text-center border-t border-slate-800">
            <p class="text-[11px] font-semibold text-amber-300 leading-snug tracking-wide uppercase">
                Proyecto con fines educativos umg sede boca del monte
            </p>
        </div>

    </div>

    <!-- Script for Dynamic Photo Upload -->
    <script>
        const photoInput = document.getElementById('photoInput');
        const profileImage = document.getElementById('profileImage');
        const photoPlaceholder = document.getElementById('photoPlaceholder');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    profileImage.src = event.target.result;
                    profileImage.classList.remove('hidden');
                    photoPlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
